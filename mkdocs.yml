site_name: Vibecoding
site_url: https://letsvibe.org
site_description: Open source knowledge base for the vibecoding community - learn AI-assisted coding, prompting strategies, and collaborative development practices.
site_author: Letsvibe.org Community

repo_name: mbernier/vibecoding
repo_url: https://github.com/mbernier/vibecoding

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Source Sans Pro
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - autolinks
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  # SEO Plugins
  - meta
  - social:
      cards_layout: default/variant
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
  - meta-descriptions:
      export_csv: false
      quiet: false
      enable_checks: true
      min_length: 50
      max_length: 160
  # LLM-friendly documentation
  - llmstxt:
      markdown_description: |
        Vibecoding is an open source knowledge base for the vibecoding community.
        Learn AI-assisted coding, prompting strategies, and collaborative development practices.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - getting-started/what-is-vibecoding.md: Introduction to vibecoding and AI-assisted development
          - getting-started/quick-start.md: Quick start guide for getting up and running
        Tools:
          - tools/index.md: Overview of AI coding tools
          - tools/config-directories.md: Understanding configuration directories
          - tools/ides/*.md
          - tools/cli/*.md
          - tools/models/*.md
        Local Development:
          - local-dev/index.md: Local development overview
          - local-dev/ide-vs-cli.md: IDE vs CLI comparison
          - local-dev/environment-setup.md: Environment setup guide
          - local-dev/planning/*.md
        Guides:
          - guides/prompting-strategies.md: Effective prompting strategies for AI coding
          - guides/ai-coding-assistants.md: Working with AI coding assistants
          - guides/best-practices.md: Best practices for vibecoding
        Resources:
          - resources/*.md
        Community:
          - community/contributing.md: How to contribute to the project
          - community/code-of-conduct.md: Community code of conduct
        FAQ:
          - faq.md: Frequently asked questions
  # Community and engagement plugins
  - rss:
      match_path: ".*"
      date_from_meta:
        as_creation: date
        as_update: git
      categories:
        - tags
      feeds_filenames:
        rss_created: feed.xml
        rss_updated: feed-updated.xml
  - git-committers:
      repository: mbernier/vibecoding
      branch: main
  - macros
  - table-reader
  # Optimization
  - optimize:
      enabled: !ENV [ENABLE_OPTIMIZE, false]
  # Print/PDF support - must be last
  - print-site:
      add_to_navigation: true
      print_page_title: "Print / PDF"
      add_print_site_banner: false
      enabled: !ENV [ENABLE_PRINT_SITE, true]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - abbr
  - def_list
  - footnotes

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://letsvibe.org
      name: letsvibe.org
    - icon: fontawesome/brands/github
      link: https://github.com/mbernier/vibecoding
      name: GitHub

nav:
  - Home: index.md
  - Getting Started:
      - What is Vibecoding?: getting-started/what-is-vibecoding.md
      - Quick Start: getting-started/quick-start.md
  - Tools:
      - Overview: tools/index.md
      - Understanding Config Directories: tools/config-directories.md
      - IDEs & Editors:
          - Cursor: tools/ides/cursor.md
          - Windsurf: tools/ides/windsurf.md
          - VS Code + Copilot: tools/ides/vscode-copilot.md
      - CLI & Terminal:
          - Claude Code: tools/cli/claude-code.md
          - Codex CLI: tools/cli/codex.md
          - Aider: tools/cli/aider.md
      - AI Models & APIs:
          - Claude: tools/models/claude.md
          - Gemini: tools/models/gemini.md
          - Qwen: tools/models/qwen.md
          - OpenAI/ChatGPT: tools/models/openai.md
  - Local Development:
      - Overview: local-dev/index.md
      - IDE vs CLI: local-dev/ide-vs-cli.md
      - Environment Setup: local-dev/environment-setup.md
      - Planning Your Work:
          - Local Planning: local-dev/planning/local-planning.md
          - BrainGrid: local-dev/planning/braingrid.md
  - Resources:
      - Community Tools: resources/index.md
      - agents-environment-config: resources/agents-environment-config.md
      - Cursor Rules Guide: resources/cursor-rules.md
  - Guides:
      - Prompting Strategies: guides/prompting-strategies.md
      - AI Coding Assistants: guides/ai-coding-assistants.md
      - Best Practices: guides/best-practices.md
  - Community:
      - Contributing: community/contributing.md
      - Code of Conduct: community/code-of-conduct.md
  - FAQ: faq.md
